<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mapa">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mapa kontakata</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<style>
/* iOS 27 look: system font, system colors, Liquid Glass surfaces, light and dark mode */
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.22);
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --indigo:#5856D6; --gray:#8E8E93;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --card:rgba(255,255,255,.78);
  --glass:rgba(252,252,254,.6); --glass-thick:rgba(246,246,249,.84);
  --stroke:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9); --sheen:rgba(255,255,255,.45);
  --shadow:0 14px 36px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  --map-bg:#e9e6df; --tiles:saturate(.8) contrast(.97) brightness(1.02);
  --ease:cubic-bezier(.32,.72,0,1);
  --sv:120px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --card:rgba(255,255,255,.075);
    --glass:rgba(36,36,40,.55); --glass-thick:rgba(28,28,31,.82);
    --stroke:rgba(255,255,255,.13); --hi:rgba(255,255,255,.16); --sheen:rgba(255,255,255,.07);
    --shadow:0 14px 36px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);
    --map-bg:#1d1d1f; --tiles:invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--map-bg);color:var(--label);
  font:400 17px/1.29 var(--font);letter-spacing:-.41px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor;stroke:none}

/* Liquid Glass */
.glass,.glass-thick{position:relative;-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);
  border:.5px solid var(--stroke);box-shadow:inset 0 .5px 0 var(--hi),var(--shadow)}
.glass{background:var(--glass)}
.glass-thick{background:var(--glass-thick);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%)}
.glass::before,.glass-thick::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(170deg,var(--sheen),transparent 38%)}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--glass-thick)} .glass,.glass-thick{-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* Map */
#map{position:fixed;inset:0;background:var(--map-bg)}
.leaflet-container{font-family:var(--font);background:var(--map-bg)}
.leaflet-tile-pane{filter:var(--tiles)}
.leaflet-bottom{bottom:calc(var(--sv) + 14px);transition:bottom .38s var(--ease)}
.leaflet-control-attribution{margin:0 12px 0 0!important;padding:1px 7px!important;border-radius:8px;font-size:10px;
  background:var(--glass)!important;color:var(--label2)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.leaflet-control-attribution a{color:var(--label2)!important}

/* Floating map controls (top right) */
.controls{position:fixed;top:calc(var(--safe-t) + 12px);right:12px;z-index:1050;display:flex;flex-direction:column;
  width:48px;border-radius:24px;transition:opacity .25s}
.controls button{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;color:var(--label)}
.controls .i{width:21px;height:21px}
.controls .sep{height:.5px;margin:0 10px;background:var(--sep)}
#locBtn.on{color:var(--blue)}
html.sheet-tall .controls,html.sheet-tall .hud{opacity:0;pointer-events:none}

/* HUD: geocoding progress */
.hud{position:fixed;top:calc(var(--safe-t) + 12px);left:12px;right:72px;z-index:1050;display:grid;grid-template-columns:auto 1fr;
  align-items:center;gap:4px 10px;padding:10px 14px 11px;border-radius:22px;font-size:15px;line-height:1.25;letter-spacing:-.24px;transition:opacity .25s}
.hud .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--fill2);overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:2px;transition:width .5s var(--ease)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--fill2);border-top-color:var(--label2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Placing banner */
.placing{position:fixed;top:calc(var(--safe-t) + 12px);left:12px;right:72px;z-index:1100;display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 16px;border-radius:24px}
.placing p{margin:0;flex:1;font-size:15px;line-height:1.3;letter-spacing:-.24px}
.placing button{flex:none;height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--fill);color:var(--blue);font-weight:600;font-size:15px}

/* Bottom sheet */
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:1000;height:calc(100% - var(--safe-t) - 18px);display:flex;flex-direction:column;
  border-radius:36px;overflow:hidden;transform:translateY(60%);transition:transform .42s var(--ease);will-change:transform}
html.dragging .sheet,html.dragging .leaflet-bottom{transition:none}
.grab{flex:none;height:18px;display:grid;place-items:center;touch-action:none}
.handle{width:36px;height:5px;border-radius:3px;background:var(--label3)}
.sheet-search{flex:none;display:flex;gap:10px;align-items:center;padding:2px 14px 12px;touch-action:none}
.sheet:not(.mode-list) .sheet-search{display:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:48px;padding:0 6px 0 14px;border-radius:24px;background:var(--fill)}
.search .i{width:19px;height:19px;color:var(--label2);stroke-width:2.4}
.search input{flex:1;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--label2)}
.clear{flex:none;width:30px;height:30px;border:0;padding:0;background:none;color:var(--label3);display:grid;place-items:center}
.clear .i{width:20px;height:20px}
.round{flex:none;width:48px;height:48px;border:0;border-radius:50%;background:var(--fill);color:var(--label);display:grid;place-items:center}
.round.sm{width:32px;height:32px}
.round.sm .i{width:15px;height:15px;stroke-width:2.6;color:var(--label2)}
.sheet-body{display:flex;flex-direction:column;flex:1;min-height:0}
.sheet-head{flex:none;padding:0 14px 12px;touch-action:none}
.sheet-head,.sheet-body .sheet-scroll{transition:opacity .2s}
html.sheet-peek .sheet.mode-list .sheet-head,html.sheet-peek .sheet.mode-list .sheet-scroll{opacity:0}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(var(--safe-b) + 20px)}

/* Segmented control */
.seg{display:flex;padding:3px;border-radius:999px;background:var(--fill)}
.seg button{flex:1;height:34px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500;letter-spacing:-.15px;
  color:var(--label);white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button[aria-selected="true"]{background:var(--card-solid,#fff);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12),0 .5px 0 rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){ .seg button[aria-selected="true"]{--card-solid:#636366} }
.seg .n{color:var(--label2);font-weight:500;margin-left:3px}

/* Inset grouped lists */
.group{list-style:none;margin:0 14px 14px;padding:0;border-radius:24px;background:var(--card);overflow:hidden}
.group > li{position:relative}
.group > li + li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.sec{margin:6px 30px 7px;font-size:15px;font-weight:600;letter-spacing:-.24px;color:var(--label2)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;background:transparent;text-align:left;color:var(--label)}
.row:active,.act:active{background:var(--fill)}
.people{--inset:68px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;letter-spacing:0;
  background:linear-gradient(180deg,#A9AFBB,#858A96)}
.avatar.lg{width:56px;height:56px;font-size:22px}
.avatar svg{width:60%;height:60%;fill:#fff}
.row-main{flex:1;min-width:0}
.name{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;margin-top:1px;font-size:15px;letter-spacing:-.24px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{display:inline-grid;place-items:center;width:15px;height:15px;margin-right:5px;border-radius:50%;background:var(--orange);color:#fff;
  font-size:11px;font-weight:700;line-height:1;vertical-align:-1px}
.row-meta{flex:none;font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,transparent);
  color:var(--orange);font-size:12px;font-weight:600;letter-spacing:0;vertical-align:2px}
.empty{padding:26px 24px;color:var(--label2);font-size:15px;text-align:center}
.hint{margin:0 30px 10px;font-size:13px;letter-spacing:-.08px;color:var(--label2)}

/* Place card */
.card-head{display:flex;align-items:center;gap:12px;padding:2px 14px 14px 16px;touch-action:none}
.card-head .t{flex:1;min-width:0}
.card-head h2{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:.07px}
.card-head p{margin:2px 0 0;font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.tiles{display:flex;gap:8px;margin:0 14px 14px}
.tile{flex:1;min-width:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:18px;
  background:var(--card);color:var(--blue);font-size:13px;font-weight:600;letter-spacing:-.08px;text-align:center}
.tile .i{width:22px;height:22px}
.tile.primary{flex:1.6;background:var(--blue);color:#fff}
.tile[aria-disabled="true"]{opacity:.4;pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;margin:0 14px 14px;padding:12px 14px;border-radius:18px;background:var(--card);font-size:15px;letter-spacing:-.24px}
.note .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:var(--gray)}
.note.warnc .dot{background:var(--orange)}
.kv{display:block;padding:11px 16px 12px;color:var(--label)}
.kv .k{display:block;font-size:13px;letter-spacing:-.08px;color:var(--label2)}
.kv .v{display:block;font-size:17px;white-space:pre-line}
a.kv .v{color:var(--blue)}
.act{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 16px;border:0;background:transparent;text-align:left;color:var(--blue);font-size:17px}
.act.destructive{color:var(--red)}
.act .chev{margin-left:auto;width:9px;height:14px;color:var(--label3);stroke-width:2.4}

/* Welcome */
.wl{padding:6px 0 0}
.wl-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 28px 18px}
.wl-head img{width:72px;height:72px;border-radius:17px;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-bottom:12px}
.wl-head h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:.36px}
.wl-head p{margin:6px 0 0;font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.steps{--inset:56px}
.steps li{display:flex;gap:14px;align-items:flex-start;padding:12px 16px 13px;font-size:15px;line-height:1.35;letter-spacing:-.24px}
.num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:14px;font-weight:600;letter-spacing:0}
.cta{display:block;width:calc(100% - 28px);height:52px;margin:4px 14px 14px;border:0;border-radius:26px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.foot{margin:4px 30px 0;font-size:13px;line-height:1.4;letter-spacing:-.08px;color:var(--label2)}

/* Pins */
.pin{position:relative}
.pin span{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#3E98FF,#0A6CF0);color:#fff;font:600 13px/1 var(--font);letter-spacing:0;
  border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:transform .2s var(--ease);transform-origin:50% 120%}
.pin span::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;margin-left:-4px;background:#fff;transform:rotate(45deg);
  border-radius:0 0 2px 0;z-index:-1}
.pin span svg{width:58%;height:58%;fill:#fff}
.pin.approx span{background:linear-gradient(180deg,#FFB13D,#F28A00)}
.pin.is-sel span{transform:scale(1.25);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cl span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#3E98FF,#0A6CF0);color:#fff;
  font:700 15px/1 var(--font);letter-spacing:0;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}

/* Menu sheet */
dialog{width:100%;max-width:560px;max-height:88%;margin:auto auto 8px;padding:0 0 calc(var(--safe-b) + 8px);border:0;border-radius:36px;color:var(--label);overflow:auto}
dialog[open]{animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:rgba(0,0,0,.25)}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 4px 22px}
.menu-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.35px}
.menu-stats{margin:0 22px 16px;font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.menu-list{--inset:58px}
.ico{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#fff}
.ico .i{width:18px;height:18px;stroke-width:2.2}
.menu-list .act{color:var(--label)}
.menu-list .act.destructive{color:var(--red)}
.credits{margin:2px 22px 8px;font-size:13px;line-height:1.4;letter-spacing:-.08px;color:var(--label2)}
.credits a{color:var(--label2);text-decoration:underline}

/* Toast */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);z-index:1200;max-width:calc(100% - 40px);padding:12px 18px;border-radius:22px;
  font-size:15px;font-weight:600;letter-spacing:-.24px;text-align:center;pointer-events:none;opacity:0;transform:translate(-50%,-10px) scale(.96);
  transition:opacity .25s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

@media (min-width:700px){
  .sheet{left:12px;right:auto;width:400px;bottom:12px;height:calc(100% - 24px)}
  .leaflet-bottom{bottom:0}
  .hud,.placing{left:424px;right:auto;width:360px}
  html.sheet-tall .controls,html.sheet-tall .hud{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa"></div>

<div class="controls glass" id="controls">
  <button type="button" id="fitBtn" aria-label="Prikaži sve na mapi">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
  </button>
  <span class="sep"></span>
  <button type="button" id="locBtn" aria-label="Moja lokacija">
    <svg class="i fill" viewBox="0 0 24 24"><path d="M20.3 3.7c.4.4.4.9.2 1.4l-6.8 14.8c-.5 1-2 .9-2.2-.2l-1.2-5.2a.9.9 0 0 0-.7-.7L5.1 12.6c-1.1-.3-1.2-1.7-.2-2.2l14-6.9c.5-.2 1-.2 1.4.2z"/></svg>
  </button>
</div>

<div class="hud glass" id="progress" hidden><span class="spinner" aria-hidden="true"></span><span id="progressText"></span><span class="bar"><i id="progressBar"></i></span></div>

<div class="placing glass" id="placing" hidden>
  <p id="placingText"></p>
  <button type="button" id="placingCancel">Otkaži</button>
</div>

<section class="sheet glass-thick mode-list" id="sheet" aria-label="Spisak">
  <div class="grab" id="grab"><span class="handle"></span></div>
  <div class="sheet-search">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
      <input id="q" type="search" placeholder="Pretraži ime, ulicu ili mesto" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Pretraga">
      <button type="button" class="clear" id="qClear" aria-label="Obriši pretragu" hidden>
        <svg class="i fill" viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm3.6 11.9a.85.85 0 0 1-1.2 1.2L12 13.2l-2.4 2.4a.85.85 0 0 1-1.2-1.2l2.4-2.4-2.4-2.4a.85.85 0 0 1 1.2-1.2l2.4 2.4 2.4-2.4a.85.85 0 0 1 1.2 1.2L13.2 12z"/></svg>
      </button>
    </label>
    <button type="button" class="round" id="menuBtn" aria-label="Meni">
      <svg class="i fill" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>
    </button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<dialog id="menu" class="glass-thick" aria-labelledby="menuTitle">
  <div class="menu-head">
    <h2 id="menuTitle">Mapa kontakata</h2>
    <button type="button" class="round sm" data-act="close" aria-label="Zatvori"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <p class="menu-stats" id="menuStats"></p>
  <ul class="group menu-list">
    <li><button type="button" class="act" data-act="import"><span class="ico" style="--c:var(--blue)"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>Učitaj kontakte iz fajla</button></li>
    <li id="backupRow"><button type="button" class="act" data-act="backup" id="backupBtn"><span class="ico" style="--c:var(--green)"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M8 11H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg></span>Sačuvaj rezervnu kopiju</button></li>

<input type="file" id="file" hidden accept=".vcf,.vcard,.json,text/vcard,text/x-vcard,text/directory,application/json">
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet.markercluster.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pl(n, one, few, many){ const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few; return many; }
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

const CYR = {'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s'};
function norm(s){
  return String(s || '').toLowerCase()
    .replace(/[Ѐ-ӿ]/g, ch => CYR[ch] ?? ch)
    .replace(/đ/g, 'dj')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/dj/g, 'd')
    .replace(/\s+/g, ' ').trim();
}

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const K = { contacts:'mk.contacts', extra:'mk.extra', hidden:'mk.hidden', geo:'mk.geo', pins:'mk.pins', loc:'mk.loc' };

/* ---------- vCard parsing ---------- */
function unescapeText(s){ return s.replace(/\\([nN,;:\\])/g, (m, c) => (c === 'n' || c === 'N') ? '\n' : c); }
function splitStruct(v){
  const out = []; let cur = '';
  for (let i = 0; i < v.length; i++){
    const c = v[i];
    if (c === '\\' && i + 1 < v.length){ cur += c + v[i + 1]; i++; continue; }
    if (c === ';'){ out.push(cur); cur = ''; continue; }
    cur += c;
  }
  out.push(cur);
  return out.map(x => unescapeText(x).trim());
}
function decodeQP(s, charset){
  const bytes = [];
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (c === '=' && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))){ bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
    else { const code = c.charCodeAt(0); if (code < 128) bytes.push(code); else for (const b of new TextEncoder().encode(c)) bytes.push(b); }
  }
  try { return new TextDecoder(charset || 'utf-8').decode(new Uint8Array(bytes)); }
  catch { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
}
const LABELS = { home:'Kuća', work:'Posao', other:'Drugo', cell:'mobilni', mobile:'mobilni', iphone:'iPhone', main:'glavni', fax:'faks', pager:'pejdžer', voice:'' };
function labelFrom(types, ab){
  if (ab){
    const m = ab.match(/^_\$!<(.+)>!\$_$/);
    const k = (m ? m[1] : ab).toLowerCase();
    return LABELS[k] ?? (m ? m[1] : ab);
  }
  for (const t of types){ if (t in LABELS && LABELS[t]) return LABELS[t]; }
  return '';
}

function parseVCards(text){
  text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '');
  const lines = text.split('\n');
  const cards = [];
  let card = null;
  for (let i = 0; i < lines.length; i++){
    let line = lines[i];
    if (!line.trim()) continue;
    // split "group.NAME;params:value" at the first colon outside quotes
    let colon = -1, inQ = false;
    for (let j = 0; j < line.length; j++){ const ch = line[j]; if (ch === '"') inQ = !inQ; else if (ch === ':' && !inQ){ colon = j; break; } }
    if (colon < 0) continue;
    const head = line.slice(0, colon);
    let value = line.slice(colon + 1);
    const parts = head.split(';');
    let name = parts[0], group = '';
    const dot = name.indexOf('.');
    if (dot > -1){ group = name.slice(0, dot).toLowerCase(); name = name.slice(dot + 1); }
    name = name.toUpperCase();
    const types = []; let enc = '', charset = '';
    for (const p of parts.slice(1)){
      const eq = p.indexOf('=');
      const k = (eq > -1 ? p.slice(0, eq) : 'TYPE').toUpperCase();
      const v = (eq > -1 ? p.slice(eq + 1) : p).replace(/"/g, '');
      if (k === 'TYPE') v.split(',').forEach(t => types.push(t.toLowerCase().trim()));
      else if (k === 'ENCODING') enc = v.toUpperCase();
      else if (k === 'CHARSET') charset = v;
      else if (k === 'QUOTED-PRINTABLE' || v.toUpperCase() === 'QUOTED-PRINTABLE') enc = 'QUOTED-PRINTABLE';
    }
    if (enc === 'QUOTED-PRINTABLE'){
      while (value.endsWith('=') && i + 1 < lines.length){ value = value.slice(0, -1) + lines[++i]; }
      value = decodeQP(value, charset);
    }
    if (name === 'BEGIN' && /vcard/i.test(value)){ card = { fn:'', n:null, org:'', nick:'', tels:[], emails:[], adrs:[], ablabel:{}, abadr:{}, note:'', url:'', geo:null, src:'' }; continue; }
    if (!card) continue;
    if (enc === 'B' || enc === 'BASE64') continue;
    switch (name){
      case 'FN': card.fn = unescapeText(value).trim(); break;
      case 'N': card.n = splitStruct(value); break;
      case 'ORG': card.org = splitStruct(value)[0] || ''; break;
      case 'NICKNAME': card.nick = unescapeText(value).trim(); break;
      case 'TEL': { const v = unescapeText(value).trim(); if (v) card.tels.push({ v, types, group }); break; }
      case 'ADR': {
        const [pobox = '', ext = '', street = '', city = '', region = '', zip = '', country = ''] = splitStruct(value);
        if ([street, city, region, zip, country].some(Boolean)) card.adrs.push({ street, ext, city, region, zip, country, types, group });
        break;
      }
      case 'X-ABLABEL': if (group) card.ablabel[group] = unescapeText(value).trim(); break;
      case 'X-ABADR': if (group) card.abadr[group] = value.trim().toLowerCase(); break;
      case 'EMAIL': { const v = unescapeText(value).trim(); if (v) card.emails.push(v); break; }
      case 'NOTE': card.note = unescapeText(value).trim(); break;
      case 'URL': if (!card.url) card.url = unescapeText(value).trim(); break;
      case 'GEO': { const m = value.replace(/^geo:/i, '').split(/[;,]/).map(Number); if (m.length >= 2 && m.every(isFinite)) card.geo = { lat: m[0], lng: m[1] }; break; }
      case 'X-MAPA-IZVOR': card.src = unescapeText(value).trim(); break;
      case 'END': if (/vcard/i.test(value)){ cards.push(card); card = null; } break;
    }
  }
  const seen = {};
  return cards.map(c => {
    let name = c.fn;
    if (!name && c.n){ const [fam = '', giv = '', add = '', pre = '', suf = ''] = c.n; name = [pre, giv, add, fam, suf].filter(Boolean).join(' '); }
    if (!name) name = c.org || c.nick || (c.tels[0] && c.tels[0].v) || 'Bez imena';
    const tels = c.tels.map(t => ({ v: t.v, label: labelFrom(t.types, t.group && c.ablabel[t.group]) }));
    const adrs = c.adrs.map(a => {
      const lines = a.street.split('\n').map(s => s.trim()).filter(Boolean);
      const street1 = lines[0] || '';
      const city = a.city || '';
      const country = a.country || '';
      const cc = (a.group && c.abadr[a.group]) || '';
      const key = norm([street1, a.zip, city || a.region, country || cc].join('|'));
      return { street: lines.join(', '), street1, city, region: a.region, zip: a.zip, country, cc: /^[a-z]{2}$/.test(cc) ? cc : '',
               label: labelFrom(a.types, a.group && c.ablabel[a.group]), key };
    });
    let id = hash(norm(name) + '|' + (tels[0] ? tels[0].v.replace(/\D/g, '') : '') + '|' + (adrs[0] ? adrs[0].key : ''));
    seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += '-' + seen[id];
    const out = { id, name, org: c.org && c.org !== name ? c.org : '', tels, adrs };
    if (c.emails.length) out.emails = c.emails;
    if (c.note) out.note = c.note;
    if (/^https?:\/\//i.test(c.url)) out.url = c.url;
    if (c.geo) out.geo = c.geo;
    if (c.src) out.src = c.src;
    return out;
  });
}

/* ---------- state ---------- */
let contacts = store.get(K.contacts, []);
let extra = store.get(K.extra, []);
let hidden = store.get(K.hidden, {});  // addresses from messages the user removed   // addresses found elsewhere (e.g. in text messages), kept apart from the phone's contacts
let geo = store.get(K.geo, {});
let pins = store.get(K.pins, {});
let entries = [];
let byId = new Map();
let tab = 'map';
let query = '';
let view = (contacts.length || extra.length) ? 'list' : 'welcome';
let selectedId = null;
let me = null;
let placing = null;

function saveAll(){
  const ok = store.set(K.contacts, contacts) && store.set(K.extra, extra) && store.set(K.hidden, hidden) && store.set(K.geo, geo) && store.set(K.pins, pins);
  if (!ok) toast('Telefon nije dozvolio čuvanje podataka. Proverite da Safari nije u privatnom režimu.');
}

const phoneKey = v => { const d = String(v || '').replace(/\D/g, ''); return d.length >= 8 ? d.slice(-9) : ''; };
function addrEntry(id, c, a, x){
  const key = a.street1 ? 'a:' + a.key : 'p:' + c.id + '|' + a.key;
  const p = pins[key], g = geo[a.key];
  let status, lat, lng;
  if (p){ status = 'manual'; lat = p.lat; lng = p.lng; }
  else if (x && x.geo){ status = 'exact'; lat = x.geo.lat; lng = x.geo.lng; }
  else if (!g) status = 'pending';
  else if (g.q === 'none') status = 'none';
  else { status = g.q; lat = g.lat; lng = g.lng; }
  return { id, c, adr: a, key, lat, lng, status, x };
}
const hideKey = (x, a) => x.id + '|' + (a ? a.key : '');
function buildEntries(){
  entries = [];
  const byPhone = new Map();
  for (const c of contacts) for (const t of c.tels) { const k = phoneKey(t.v); if (k && !byPhone.has(k)) byPhone.set(k, c); }
  const fromMsgs = new Map(); // phone contact id -> addresses found in messages for that person
  for (const x of extra){
    const owner = x.tels.map(t => byPhone.get(phoneKey(t.v))).find(Boolean);
    if (owner){ if (!fromMsgs.has(owner.id)) fromMsgs.set(owner.id, []); fromMsgs.get(owner.id).push(x); }
    else {
      // nobody in the phone's contacts has this number: show the person as found in the message
      if (!x.adrs.length){
        if (hidden[hideKey(x, null)]) continue;
        const key = 'n:' + x.id, p = pins[key], pos = p || x.geo;
        entries.push({ id: 'x:' + x.id, c: x, adr: null, key, lat: pos && pos.lat, lng: pos && pos.lng, status: p ? 'manual' : pos ? 'exact' : 'noaddr', x });
      } else x.adrs.forEach((a, i) => { if (!hidden[hideKey(x, a)]) entries.push(addrEntry('x:' + x.id + '#' + i, x, a, x)); });
    }
  }
  for (const c of contacts){
    const found = fromMsgs.get(c.id) || [];
    const own = new Set(c.adrs.map(a => a.key));
    const more = [];
    for (const x of found) for (const a of x.adrs) if (!own.has(a.key) && !hidden[hideKey(x, a)]){ own.add(a.key); more.push([a, x]); }
    if (!c.adrs.length && !more.length){
      const key = 'n:' + c.id, p = pins[key];
      const x = found[0];
      const pos = p || (x && x.geo);
      entries.push({ id: c.id, c, adr: null, key, lat: pos && pos.lat, lng: pos && pos.lng, status: p ? 'manual' : pos ? 'exact' : 'noaddr', x });
      continue;
    }
    c.adrs.forEach((a, i) => entries.push(addrEntry(c.id + '#' + i, c, a, null)));
    more.forEach(([a, x], i) => entries.push(addrEntry(c.id + '#m' + i, c, a, x)));
  }
  for (const e of entries){
    e.hay = norm([e.c.name, e.c.org, e.adr && e.adr.street, e.adr && e.adr.city, e.adr && e.adr.zip, e.adr && e.adr.region, e.x && e.x.note, e.x && e.x !== e.c && e.x.name].filter(Boolean).join(' '));
    e.hasPos = typeof e.lat === 'number' && typeof e.lng === 'number';
  }
  byId = new Map(entries.map(e => [e.id, e]));
}
const isCheck = e => e.status === 'city' || e.status === 'none';
function visibleEntries(){ return query ? entries.filter(e => e.hay.includes(query)) : entries; }

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: true, tap: false }).setView([45.5, 14], 5);
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 46, spiderfyOnMaxZoom: true, zoomToBoundsOnClick: true,
  iconCreateFunction: c => L.divIcon({ html: '<span>' + c.getChildCount() + '</span>', className: 'cl', iconSize: [42, 42] })
});
map.addLayer(cluster);
const markers = new Map();
let meMarker = null;

function initials(name){
  const w = String(name || '').replace(/[()]/g, ' ').split(/\s+/).filter(t => /\p{L}/u.test(t) && !/^(i|porodica|otac|madame)$/i.test(t));
  if (!w.length) return '';
  return ((w[0][0] || '') + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
}
const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c.8-4 3.9-6 7.5-6s6.7 2 7.5 6z"/></svg>';
function avatarInner(name){ const t = initials(name); return t ? esc(t) : PERSON; }
function pinIcon(e, sel){
  const cls = 'pin' + (e.status === 'city' ? ' approx' : '') + (sel ? ' is-sel' : '');
  return L.divIcon({ className: cls, html: '<span>' + avatarInner(e.c.name) + '</span>', iconSize: [34, 41], iconAnchor: [17, 41] });
}
function drawMarkers(){
  cluster.clearLayers(); markers.clear();
  const list = [];
  for (const e of visibleEntries()){
    if (!e.hasPos) continue;
    const m = L.marker([e.lat, e.lng], { icon: pinIcon(e, e.id === selectedId), title: e.c.name, keyboard: true });
    m.on('click', () => select(e.id, false));
    markers.set(e.id, m); list.push(m);
  }
  cluster.addLayers(list);
}
function fitAll(list){
  const pts = (list || visibleEntries()).filter(e => e.hasPos).map(e => [e.lat, e.lng]);
  if (!pts.length) return;
  const wide = window.innerWidth >= 700;
  map.fitBounds(L.latLngBounds(pts), wide
    ? { paddingTopLeft: [450, 50], paddingBottomRight: [80, 50], maxZoom: 15 }
    : { paddingTopLeft: [30, safeTop() + 70], paddingBottomRight: [70, sheetVisible() + 30], maxZoom: 15 });
}
function focusEntry(e){
  // put the pin in the middle of the part of the map that is not covered by the sheet
  autoFit = false;
  const z = Math.max(map.getZoom(), 17);
  const wide = window.innerWidth >= 700;
  const offset = wide ? 0 : Math.max(0, (sheetVisible() - safeTop() - 4) / 2);
  const p = map.project([e.lat, e.lng], z).add([wide ? -220 : 0, offset]);
  const m = markers.get(e.id);
  if (m) map.once('moveend', () => {
    // people living at the same address sit in one cluster: fan them out
    const par = cluster.getVisibleParent(m);
    if (par && par !== m && par.spiderfy) par.spiderfy();
  });
  map.flyTo(map.unproject(p, z), z, { duration: .6 });
}
let autoFit = false;
map.on('dragstart', () => { autoFit = false; });

/* ---------- bottom sheet ---------- */
const sheet = $('#sheet');
let sheetState = 'peek', sheetY = 0;
function safeBottom(){ return parseFloat(getComputedStyle($('#safeProbe')).paddingBottom) || 0; }
function safeTop(){ return parseFloat(getComputedStyle($('#safeProbe')).paddingTop) || 0; }
function sheetStops(){
  const h = sheet.offsetHeight;
  const peek = (view === 'list' ? 82 : 100) + Math.max(0, safeBottom() - 8);
  return { full: 0, half: Math.max(0, h - Math.round(window.innerHeight * 0.5)), peek: Math.max(0, h - peek) };
}
function applySheetY(y){
  sheetY = y;
  sheet.style.transform = 'translateY(' + y + 'px)';
  const vis = sheet.offsetHeight - y, root = document.documentElement;
  root.style.setProperty('--sv', Math.min(vis + 8, window.innerHeight * 0.6) + 'px');
  root.classList.toggle('sheet-tall', vis > window.innerHeight * 0.62);
  root.classList.toggle('sheet-peek', vis < 130 + safeBottom());
}
function setSheet(state){ sheetState = state; applySheetY(sheetStops()[state]); }
function sheetVisible(){ return sheet.offsetHeight - sheetStops()[sheetState]; }
window.addEventListener('resize', () => setSheet(sheetState));

(function enableDrag(){
  let d = null;
  const start = ev => {
    if (ev.target.closest('button,input,a')) return;
    d = { y0: ev.touches[0].clientY, t0: sheetY, moved: false, grab: !!ev.target.closest('#grab') };
    document.documentElement.classList.add('dragging');
  };
  const move = ev => {
    if (!d) return;
    const dy = ev.touches[0].clientY - d.y0;
    if (Math.abs(dy) > 5) d.moved = true;
    const s = sheetStops();
    applySheetY(Math.min(s.peek, Math.max(0, d.t0 + dy)));
  };
  const end = () => {
    if (!d) return;
    document.documentElement.classList.remove('dragging');
    const s = sheetStops();
    if (!d.moved){ if (d.grab) setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek'); d = null; return; }
    const vel = sheetY - d.t0;
    let best = 'peek', bestD = Infinity;
    for (const [k, v] of Object.entries(s)){ const dist = Math.abs(v - sheetY - (vel > 0 ? -40 : 40)); if (dist < bestD){ bestD = dist; best = k; } }
    setSheet(best); d = null;
  };
  $('#grab').addEventListener('touchstart', start, { passive: true });
  sheet.addEventListener('touchstart', ev => { if (ev.target.closest('.sheet-head,.sheet-search,.card-head,.wl-head')) start(ev); }, { passive: true });
  window.addEventListener('touchmove', move, { passive: true });
  window.addEventListener('touchend', end);
  window.addEventListener('touchcancel', end);
  $('#grab').addEventListener('click', () => { if (!('ontouchstart' in window)) setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek'); });
})();

/* ---------- rendering ---------- */
const ICON = {
  close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  car: '<svg class="i" viewBox="0 0 24 24"><path d="M5.2 11.5l1.4-4.1A2 2 0 0 1 8.5 6h7a2 2 0 0 1 1.9 1.4l1.4 4.1"/><rect x="3.5" y="11.5" width="17" height="5.5" rx="1.6"/><path d="M6.5 17v1.6M17.5 17v1.6"/><path d="M7 14.2h.01M17 14.2h.01" stroke-width="2.6"/></svg>',
  phone: '<svg class="i fill" viewBox="0 0 24 24"><path d="M7.2 3.3c.6-.3 1.3-.1 1.6.5l1.5 3.1c.3.6.1 1.2-.3 1.6L8.6 9.7a12 12 0 0 0 5.7 5.7l1.2-1.4c.4-.5 1-.6 1.6-.3l3.1 1.5c.6.3.8 1 .5 1.6l-.8 1.7c-.4.9-1.4 1.5-2.4 1.3C10.2 18.6 5.4 13.8 4.2 6.6c-.2-1 .4-2 1.3-2.4z"/></svg>',
  pin: '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/></svg>',
  chev: '<svg class="i chev" viewBox="0 0 9 14"><path d="M1.5 1.5 7 7l-5.5 5.5"/></svg>'

function km(e){
  if (!me || !e.hasPos) return null;
  const R = 6371, toR = Math.PI / 180;
  const dLat = (e.lat - me.lat) * toR, dLng = (e.lng - me.lng) * toR;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(me.lat * toR) * Math.cos(e.lat * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtKm(d){
  if (d == null) return '';
  if (d < 1) return Math.max(10, Math.round(d * 100) * 10) + ' m';
  return d.toLocaleString('sr-Latn', { maximumFractionDigits: d < 10 ? 1 : 0 }) + ' km';
}
function adrLine(a){ if (!a) return ''; return [a.street, [a.zip, a.city].filter(Boolean).join(' ')].filter(Boolean).join(', ') || a.region || a.country; }
function telHref(v){ return 'tel:' + v.replace(/[^\d+]/g, ''); }
function telText(v){ const d = v.replace(/\s+/g, ''); return /^\+33\d{9}$/.test(d) ? '+33 ' + d.slice(3, 4) + ' ' + d.slice(4).replace(/(\d\d)(?=\d)/g, '$1 ') : v; }

function updateLocBtn(){ $('#locBtn').classList.toggle('on', !!me); }
function locate(fly){
  if (!navigator.geolocation){ toast('Lokacija nije dostupna na ovom uređaju.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    store.set(K.loc, true);
    if (!meMarker){
      meMarker = L.layerGroup([
        L.circleMarker([me.lat, me.lng], { radius: 20, stroke: false, fillColor: '#0A84FF', fillOpacity: .16, interactive: false }),
        L.circleMarker([me.lat, me.lng], { radius: 7.5, color: '#fff', weight: 3, fillColor: '#0A84FF', fillOpacity: 1, interactive: false })
      ]).addTo(map);
    } else meMarker.eachLayer(l => l.setLatLng([me.lat, me.lng]));
    if (fly) map.flyTo([me.lat, me.lng], Math.max(map.getZoom(), 14), { duration: .6 });
    renderListKeepScroll(); updateLocBtn();
  }, err => {
    if (fly) toast(err.code === 1 ? 'Lokacija je isključena. Uključite je u Podešavanjima: Privatnost, Lokacija, Safari.' : 'Lokacija trenutno nije dostupna.');
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

/* import / backup */
$('#file').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  let text;
  try { text = await f.text(); } catch { toast('Fajl nije moguće pročitati.'); return; }
  if (/^\s*\{/.test(text)) return restore(text);
  if (!/BEGIN:VCARD/i.test(text)){ toast('Ovo nije fajl sa kontaktima. Izaberite fajl koji se završava na .vcf.'); return; }
  const list = parseVCards(text);
  if (!list.length){ toast('U ovom fajlu nema kontakata.'); return; }
  const isExtra = list.some(c => c.src);
  // a file of addresses found in messages is added next to the phone's contacts; a contacts export replaces the old export
  if (isExtra) extra = list; else contacts = list;
  saveAll();
  view = 'list'; tab = 'map'; selectedId = null; autoFit = true;
  refresh(); setSheet('half'); fitAll();
  const withAdr = list.filter(c => c.adrs.length).length;
  toast(isExtra
    ? `Dodato iz poruka: ${list.length} ${pl(list.length, 'osoba', 'osobe', 'osoba')}. Vaši kontakti su ostali isti.`
    : `Učitano: ${list.length} ${pl(list.length, 'kontakt', 'kontakta', 'kontakata')}, od toga ${withAdr} sa adresom.`);
  runGeocoder();
});
function restore(text){
  let d; try { d = JSON.parse(text); } catch { toast('Rezervna kopija je oštećena.'); return; }
  if (!d || d.app !== 'mapa-kontakata' || !Array.isArray(d.contacts)){ toast('Ovo nije rezervna kopija ove aplikacije.'); return; }
  contacts = d.contacts; extra = Array.isArray(d.extra) ? d.extra : extra; hidden = d.hidden || hidden;
  geo = Object.assign(geo, d.geo || {}); pins = Object.assign(pins, d.pins || {});
  saveAll(); view = 'list'; tab = 'map'; autoFit = true; refresh(); setSheet('half'); fitAll();
  toast('Rezervna kopija je vraćena.');
  runGeocoder();
}
async function backup(){
  const data = JSON.stringify({ app: 'mapa-kontakata', v: 1, savedAt: new Date().toISOString(), contacts, extra, hidden, geo, pins });
  const name = 'mapa-kontakata-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: name }); return; }
  } catch (err){ if (err && err.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function wipe(){
  if (!confirm('Obrisati sve kontakte i tačke sa ovog telefona? Kontakti u iPhone-u ostaju netaknuti.')) return;
  Object.values(K).forEach(k => store.del(k));
  contacts = []; extra = []; hidden = {}; geo = {}; pins = {}; me = null; selectedId = null; view = 'welcome';
  if (meMarker){ map.removeLayer(meMarker); meMarker = null; }
  refresh(); setSheet('full');
  toast('Podaci su obrisani.');
}

/* ---------- geocoding (OpenStreetMap Nominatim, max 1 request per second) ---------- */
let geoRunning = false, lastReq = 0, wake = null;
async function holdScreen(){ try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch {} }
function releaseScreen(){ try { if (wake) wake.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && geoRunning) holdScreen(); });

function cleanStreet(s){
  return String(s || '')
    .replace(/\b(b\.?\s?b\.?|bez broja)(?=\s|,|$)/ig, '')
    .replace(/\b(br\.|broj)\s*/ig, '')
    .replace(/,?\s*(stan|st\.|sprat|ulaz|apt\.?|appartement|bât\.?|bat\.|étage)\s*[\w\d-]*\s*$/i, '')
    .replace(/(\d+[a-zA-Z]?)\s*\/\s*[\w\d]+/, '$1')
    .replace(/\s{2,}/g, ' ').replace(/^[\s,]+|[\s,]+$/g, '');
}
function stripHouseNumber(s){
  let t = s.replace(/^\s*\d+\s*(bis|ter|[a-zA-Z])?\s*,?\s+(?=\D)/i, '');
  if (t === s) t = s.replace(/[\s,]+\d+\s*[a-zA-Z]?\s*$/, '');
  return t.trim();
}
async function nominatim(params, limit = 1){
  const wait = lastReq + 1100 - Date.now(); if (wait > 0) await sleep(wait);
  lastReq = Date.now();
  const sp = new URLSearchParams({ format: 'jsonv2', limit: String(limit) });
  for (const [k, v] of Object.entries(params)) if (v) sp.set(k, v);
  const r = await fetch('https://nominatim.openstreetmap.org/search?' + sp.toString());
  if (r.status === 429 || r.status >= 500) throw new Error('busy');
  if (!r.ok) return [];
  const j = await r.json();
  return Array.isArray(j) ? j : [];
}
// how precise a result is: a house, only the street, or only the town
const QORDER = { exact: 0, street: 1, city: 2 };
const rankQ = r => r.place_rank >= 28 ? 'exact' : r.place_rank >= 25 ? 'street' : 'city';
function dist2(a, b){ const dx = (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180), dy = a.lat - b.lat; return dx * dx + dy * dy; }
async function cityCenter(a, city){
  const key = 'c:' + norm([city, a.country || a.cc].join('|'));
  if (!geo[key]){
    const hit = (await nominatim({ city, country: a.country, countrycodes: a.cc }))[0];
    geo[key] = hit ? { q: 'center', lat: +hit.lat, lng: +hit.lon } : { q: 'none' };
  }
  return geo[key].q === 'none' ? null : geo[key];
}
// The same street name often exists in several parts of one city (Beograd, Grocka, Mladenovac...).
// Prefer the most precise match, and among equals the one nearest to the town centre.
async function pick(list, a, city){
  if (!list.length) return null;
  let c = list.map(r => ({ q: rankQ(r), lat: +r.lat, lng: +r.lon }));
  const top = Math.min(...c.map(x => QORDER[x.q]));
  c = c.filter(x => QORDER[x.q] === top);
  if (c.length > 1 && city){
    const ctr = await cityCenter(a, city);
    if (ctr) c.sort((x, y) => dist2(x, ctr) - dist2(y, ctr));
  }
  return c[0];
}
async function geocodeAddress(a){
  const cc = a.cc ? { countrycodes: a.cc } : {};
  const city = a.city || a.region;
  const street = cleanStreet(a.street1);
  const bare = street ? stripHouseNumber(street) : '';
  const place = [a.zip, city].filter(Boolean).join(' ');
  const tries = []; // [best quality this try can give, query, how many results, run only if nothing found yet]
  if (street && city){
    tries.push(['exact', { street, city, postalcode: a.zip, country: a.country, ...cc }, 5]);
    if (a.zip) tries.push(['exact', { street, city, country: a.country, ...cc }, 5, true]);
    tries.push(['exact', { q: [street, place, a.country].filter(Boolean).join(', '), ...cc }, 5]);
    if (bare && bare !== street) tries.push(['street', { street: bare, city, country: a.country, ...cc }, 5]);
  } else if (street){
    tries.push(['city', { q: [street, a.zip, a.country].filter(Boolean).join(', '), ...cc }, 1]);
  }
  if (city){
    tries.push(['city', { city, postalcode: a.zip, country: a.country, ...cc }, 1]);
    tries.push(['city', { q: [city, a.country].filter(Boolean).join(', '), ...cc }, 1]);
  } else if (a.zip){
    tries.push(['city', { postalcode: a.zip, country: a.country, ...cc }, 1]);
  }
  let best = null;
  for (const [cap, params, limit, onlyIfEmpty] of tries){
    if (best && (onlyIfEmpty || QORDER[best.q] <= QORDER[cap])) continue;
    const hit = await pick(await nominatim(params, limit), a, city);
    if (!hit) continue;
    if (QORDER[hit.q] < QORDER[cap]) hit.q = cap;
    if (!best || QORDER[hit.q] < QORDER[best.q]) best = hit;
  }
  return best ? { q: best.q, lat: +best.lat.toFixed(6), lng: +best.lng.toFixed(6) } : { q: 'none' };
}
function pendingAddresses(){
  const seen = new Set(), out = [];
  for (const e of entries){
    if (e.status !== 'pending' || seen.has(e.adr.key)) continue;
    seen.add(e.adr.key); out.push(e.adr);
  }
  return out;
}
function showProgress(text, frac){
  $('#progress').hidden = false;
  $('#progressText').textContent = text;
  $('#progressBar').style.width = Math.round((frac || 0) * 100) + '%';
}
async function runGeocoder(){
  if (geoRunning) return;
  let todo = pendingAddresses();
  if (!todo.length){ $('#progress').hidden = true; return; }
  geoRunning = true; holdScreen();
  const total = todo.length; let done = 0, sinceDraw = 0;
  for (let i = 0; i < todo.length; i++){
    const a = todo[i];
    if (geo[a.key]){ done++; continue; }
    if (!navigator.onLine){
      showProgress('Nema interneta. Traženje adresa se nastavlja kad se veza vrati.', done / total);
      await new Promise(r => window.addEventListener('online', r, { once: true }));
    }
    const left = total - done;
    const mins = Math.ceil(left * 1.4 / 60);
    showProgress(`Tražim adrese na mapi: ${done} od ${total}` + (left > 40 ? `, još oko ${mins} min` : ''), done / total);
    try {
      geo[a.key] = await geocodeAddress(a);
    } catch {
      showProgress('Server za mape je zauzet. Nastavljam za minut.', done / total);
      await sleep(60000); i--; continue;
    }
    done++; sinceDraw++;
    store.set(K.geo, geo);
    if (sinceDraw >= 5 || done === total){ sinceDraw = 0; buildEntries(); drawMarkers(); renderListKeepScroll(); if (autoFit) fitAll(); }
  }
  geoRunning = false; releaseScreen();
  buildEntries(); drawMarkers(); renderListKeepScroll();
  if (autoFit) fitAll();
  // contacts may have been imported meanwhile: keep going before announcing anything
  if (pendingAddresses().length){ runGeocoder(); return; }
  const chk = entries.filter(isCheck).length;
  $('#progress').hidden = true;
  toast(chk ? `Gotovo. ${chk} ${pl(chk, 'adresu', 'adrese', 'adresa')} treba proveriti.` : 'Gotovo. Sve adrese su na mapi.');
}

/* ---------- misc ---------- */
let toastTimer = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}
function refresh(){ buildEntries(); drawMarkers(); render(); }

/* ---------- start ---------- */
refresh();
setSheet(contacts.length || extra.length ? 'peek' : 'full');
if (contacts.length || extra.length) fitAll();
if (store.get(K.loc, false)) locate(false);
autoFit = entries.some(e => e.status === 'pending');
runGeocoder();
</script>
